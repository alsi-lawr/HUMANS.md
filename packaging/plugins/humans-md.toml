schema_version = 1
name = "humans-md"
version = "0.1.2"
publisher = "alsi-lawr"
repository = "alsi-lawr/HUMANS.md"
repository_url = "https://github.com/alsi-lawr/HUMANS.md"
license = "MIT"
description = "Portable behavioural contracts and governed Casefile workflows for coding agents."

[[shared]]
source = "LICENSE"
destination = "LICENSE"

[[shared]]
source = "AGENTS.md"
destination = "templates/AGENTS.md"

[[shared]]
source = "casefile-workflow"
destination = "casefile-workflow"

[[shared]]
source = "verification"
destination = "verification"

[[shared]]
source = "scripts/validate-skill.py"
destination = "scripts/validate-skill.py"

[[shared]]
source = "scripts/verify-skill.py"
destination = "scripts/verify-skill.py"

[[shared]]
source = "scripts/validate-casefile.py"
destination = "scripts/validate-casefile.py"

[[shared]]
source = "skills/casefile-workflow"
destination = "skills/casefile-workflow"

[[shared]]
source = "skills/casefile-investigate-solo"
destination = "skills/casefile-investigate-solo"

[[shared]]
source = "skills/casefile-investigate-atomic"
destination = "skills/casefile-investigate-atomic"

[[shared]]
source = "skills/casefile-investigate-inspector-tree"
destination = "skills/casefile-investigate-inspector-tree"

[[shared]]
source = "skills/casefile-review-atomic"
destination = "skills/casefile-review-atomic"

[[shared]]
source = "skills/casefile-review-dialogue"
destination = "skills/casefile-review-dialogue"

[[shared]]
source = "skills/casefile-review-two-stage"
destination = "skills/casefile-review-two-stage"

[[shared]]
source = "skills/casefile-implement-ticket-batch"
destination = "skills/casefile-implement-ticket-batch"

[[shared]]
source = "skills/casefile-switch-strategy"
destination = "skills/casefile-switch-strategy"

[[shared]]
source = "skills/casefile-closeout"
destination = "skills/casefile-closeout"

[[shared]]
source = "skills/contract-bootstrap"
destination = "skills/contract-bootstrap"

[[shared]]
source = "skills/skill-generator"
destination = "skills/skill-generator"

[[shared]]
source = "skills/readme-generator"
destination = "skills/readme-generator"

[vendors.codex]
output = "build/marketplace/plugins/codex/humans-md"

[[vendors.codex.template]]
source = "adapters/codex/metadata/plugin.json.in"
destination = ".codex-plugin/plugin.json"
format = "json"

[[vendors.codex.copy]]
source = "adapters/codex/README.md"
destination = "README.md"

[[vendors.codex.copy]]
source = "adapters/codex/agents"
destination = "agents"

[[vendors.codex.copy]]
source = "adapters/codex/matrices"
destination = "matrices"

[[vendors.codex.copy]]
source = "adapters/codex/instructions"
destination = "config/instructions"

[[vendors.codex.copy]]
source = "adapters/codex/catalog"
destination = "config/catalog"

[[vendors.codex.copy]]
source = "adapters/codex/config-fragment.toml.in"
destination = "config/config-fragment.toml.in"

[[vendors.codex.copy]]
source = "adapters/codex/root.config.toml"
destination = "config/root.config.toml"

[[vendors.codex.copy]]
source = "adapters/codex/profiles.toml"
destination = "config/profiles.toml"

[[vendors.codex.copy]]
source = "adapters/codex/scripts"
destination = "scripts"

[[vendors.codex.copy]]
source = "adapters/codex/skills"
destination = "skills"

[vendors.claude]
output = "build/marketplace/plugins/claude/humans-md"

[[vendors.claude.template]]
source = "adapters/claude/metadata/plugin.json.in"
destination = ".claude-plugin/plugin.json"
format = "json"

[[vendors.claude.copy]]
source = "adapters/claude/README.md"
destination = "README.md"

[[vendors.claude.copy]]
source = "adapters/claude/agents"
destination = "agents"

[[vendors.claude.copy]]
source = "adapters/claude/matrices"
destination = "matrices"

[[vendors.claude.copy]]
source = "adapters/claude/profiles.toml"
destination = "config/profiles.toml"

[[vendors.claude.copy]]
source = "adapters/claude/skills"
destination = "skills"

[[vendors.claude.copy]]
source = "skills/git-contribution"
destination = "skills/git-contribution"
