name: Reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-rust-portability:
    name: Native Rust portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run planning-path and governed-replay suites natively
        run: cargo test --manifest-path casefile/Cargo.toml -p casefile-core -p casefile-store -p casefile-tui -p casefile-cli

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Casefile web dependencies
        working-directory: casefile/web
        run: bun install --frozen-lockfile
      - name: Check source formatting
        run: scripts/format-source.sh --check
      - name: Check ASCII source
        run: python scripts/strip-non-ascii.py --check .
      - name: Run package-local and shared tests
        run: python scripts/test-all.py
      - name: Check Casefile web workbench
        working-directory: casefile/web
        run: |
          bun run typecheck
          bun run test
          bun run build
      - name: Check Casefile Rust workspace
        working-directory: casefile
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Validate source roots
        run: |
          python scripts/validate-package-roots.py
          python casefile/scripts/validate-casefile.py --source casefile
          python coding/scripts/validate-skill.py --all --root coding
      - name: Build and validate package inventory
        run: |
          python scripts/package-plugin.py build --manifest humans-md/packaging/plugin.toml
          python scripts/package-plugin.py build --manifest coding/packaging/plugin.toml
          python scripts/package-plugin.py check --manifest humans-md/packaging/plugin.toml
          python scripts/package-plugin.py check --manifest coding/packaging/plugin.toml
      - name: Strict Claude package validation
        run: |
          npm install --global @anthropic-ai/claude-code
          for package in build/marketplace/plugins/claude/*; do claude plugin validate "$package" --strict; done
      - name: Isolated Codex sibling lifecycle smoke
        run: |
          npm install --global @openai/codex
          cp -R packaging/marketplace/. build/marketplace/
          cp LICENSE build/marketplace/LICENSE
          for removed in coding humans-md; do
            export CODEX_HOME="$RUNNER_TEMP/codex-$removed"
            mkdir -p "$CODEX_HOME"
            codex plugin marketplace add "$GITHUB_WORKSPACE/build/marketplace" --json
            for plugin in humans-md coding; do codex plugin add "$plugin@humans-md" --json; done
            codex plugin list --available --json | python scripts/check-codex-discovery.py
            codex plugin remove "$removed@humans-md" --json
            expected="humans-md,coding"; expected="${expected/$removed,}"; expected="${expected/,$removed/}"; expected="${expected/$removed/}"
            codex plugin list --json | python scripts/check-plugin-state.py --expected "$expected"
            codex plugin marketplace list --json | grep -q '"humans-md"'
          done
      - name: Isolated Claude sibling lifecycle smoke
        run: |
          npm install --global @anthropic-ai/claude-code
          for removed in coding humans-md; do
            export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-$removed"
            mkdir -p "$CLAUDE_CONFIG_DIR"
            claude plugin marketplace add "$GITHUB_WORKSPACE/build/marketplace"
            for plugin in humans-md coding; do claude plugin install "$plugin@humans-md" --scope user; done
            claude plugin uninstall "$removed@humans-md" --scope user
            expected="humans-md,coding"; expected="${expected/$removed,}"; expected="${expected/,$removed/}"; expected="${expected/$removed/}"
            claude plugin list --json | python scripts/check-claude-plugin-state.py --expected "$expected" --absent "$removed"
            claude plugin marketplace list --json | grep -q 'humans-md'
          done
