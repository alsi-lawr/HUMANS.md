name: Reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Check ASCII source
        run: python scripts/strip-non-ascii.py --check .
      - name: Run stdlib tests
        run: python -m unittest discover -s tests -v
      - name: Validate source
        run: |
          python scripts/validate-skill.py --all --root .
          python scripts/validate-casefile.py --source .
      - name: Build and validate packages
        run: |
          python scripts/package-plugin.py build --all
          cp -R packaging/marketplace/. build/marketplace/
          python scripts/package-plugin.py check --all
          python scripts/validate-skill.py --root . --package build/marketplace/plugins/codex/humans-md --package build/marketplace/plugins/claude/humans-md
          python build/marketplace/plugins/codex/humans-md/scripts/validate-skill.py --all --root build/marketplace/plugins/codex/humans-md
          python build/marketplace/plugins/codex/humans-md/scripts/validate-casefile.py --source build/marketplace/plugins/codex/humans-md
          python build/marketplace/plugins/claude/humans-md/scripts/validate-skill.py --all --root build/marketplace/plugins/claude/humans-md
          python build/marketplace/plugins/claude/humans-md/scripts/validate-casefile.py --source build/marketplace/plugins/claude/humans-md
      - name: Strict Claude package validation
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate build/marketplace/plugins/claude/humans-md --strict
      - name: Isolated Codex marketplace install and discovery
        run: |
          npm install --global @openai/codex
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE/build/marketplace" --json
          codex plugin add humans-md@humans-md --json
          codex plugin list --available --json | python scripts/check-codex-discovery.py
