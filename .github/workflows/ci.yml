name: Reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Check ASCII source
        run: python scripts/strip-non-ascii.py --check .
      - name: Run package-local and shared tests
        run: python scripts/test-all.py
      - name: Validate source roots
        run: |
          python scripts/validate-package-roots.py
          python casefile/scripts/validate-casefile.py --source casefile
          python coding/scripts/validate-skill.py --all --root coding
      - name: Build and validate package inventory
        run: |
          python scripts/package-plugin.py build --all
          python scripts/build-marketplace-catalog.py
          cp -R packaging/marketplace/. build/marketplace/
          cp LICENSE build/marketplace/LICENSE
          python scripts/package-plugin.py check --all
          python scripts/validate-package-roots.py
          python casefile/scripts/validate-casefile.py --source build/marketplace/plugins/codex/casefile
          python casefile/scripts/validate-casefile.py --source build/marketplace/plugins/claude/casefile
          python coding/scripts/validate-skill.py --all --root build/marketplace/plugins/codex/coding
          python coding/scripts/validate-skill.py --all --root build/marketplace/plugins/claude/coding
      - name: Strict Claude package validation
        run: |
          npm install --global @anthropic-ai/claude-code
          for package in build/marketplace/plugins/claude/*; do claude plugin validate "$package" --strict; done
      - name: Isolated Codex sibling lifecycle smoke
        run: |
          npm install --global @openai/codex
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE/build/marketplace" --json
          for plugin in humans-md casefile coding; do codex plugin add "$plugin@humans-md" --json; done
          codex plugin list --available --json | python scripts/check-codex-discovery.py
          codex plugin list --json | python scripts/check-plugin-state.py --expected humans-md,casefile,coding
          for plugin in coding casefile humans-md; do
            codex plugin remove "$plugin@humans-md" --json
            remaining="humans-md,casefile,coding"; remaining="${remaining/$plugin,}"; remaining="${remaining/,$plugin/}"; remaining="${remaining/$plugin/}"
            codex plugin list --json | python scripts/check-plugin-state.py --expected "$remaining"
            codex plugin marketplace list --json | grep -q '"humans-md"'
          done
      - name: Isolated Claude sibling lifecycle smoke
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add "$GITHUB_WORKSPACE/build/marketplace"
          for plugin in humans-md casefile coding; do claude plugin install "$plugin@humans-md" --scope user; done
          for plugin in coding casefile humans-md; do
            claude plugin uninstall "$plugin@humans-md" --scope user
            claude plugin marketplace list | grep -q 'humans-md'
          done
