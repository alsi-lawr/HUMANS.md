[package]
name = "casefile-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
casefile-core = { path = "../casefile-core" }
regex.workspace = true
serde = { workspace = true, features = ["rc"] }
serde-saphyr.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
walkdir = "2.5.0"
rayon = "1.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
