[workspace]
members = ["casefile-core", "casefile-store", "casefile-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
pulldown-cmark = "0.13.0"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde-saphyr = "0.0.29"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["parsing"] }
toml = "0.8.23"
