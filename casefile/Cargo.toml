[workspace]
members = ["casefile-core", "casefile-store", "casefile-store-sqlite", "casefile-server", "casefile-tui", "casefile-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
crossterm = "=0.29.0"
getrandom = "0.4.3"
pulldown-cmark = "0.13.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
regex = "1.11.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde-saphyr = "0.0.29"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["parsing"] }
tiny_http = "0.12.0"
toml = "0.8.23"
