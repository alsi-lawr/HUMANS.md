schema_version = 1
strategy_id = "casefile-investigate-atomic"
phase = "investigation"
adapter = "claude"
[orchestrator]
binding = "root"
[limits]
max_concurrent_subagents = 6
max_depth = 1
[requirements]
capabilities = ["subagents", "shared_writable_planning"]
[[workers]]
role = "detective"
platform_profile = "detective"
model = "sonnet"
reasoning = "medium-high"
minimum_count = 1
maximum_count = 6
can_spawn_subagents = false
[coordination]
batch_when_capacity_exceeded = true
candidate_review_before_ticket = true
shared_ticket_storage_required = true
