schema_version = 1
adapter = "claude"

[effort_policy]
medium-high = "high"

[[workers]]
role = "inspector"
profile = "inspector"
agent_file = "agents/inspector.md"
model = "opus"
policy_tier = "high"
frontmatter_effort = "high"

[[workers]]
role = "detective"
profile = "detective"
agent_file = "agents/detective.md"
model = "sonnet"
policy_tier = "medium-high"
frontmatter_effort = "high"

[[workers]]
role = "dialogue-review-chair"
profile = "dialogue-review-chair"
agent_file = "agents/dialogue-review-chair.md"
model = "opus"
policy_tier = "high"
frontmatter_effort = "high"

[[workers]]
role = "dialogue-review-challenger"
profile = "dialogue-review-challenger"
agent_file = "agents/dialogue-review-challenger.md"
model = "sonnet"
policy_tier = "medium-high"
frontmatter_effort = "high"

[[workers]]
role = "atomic-ticket-reviewer"
profile = "atomic-ticket-reviewer"
agent_file = "agents/atomic-ticket-reviewer.md"
model = "sonnet"
policy_tier = "medium-high"
frontmatter_effort = "high"

[[workers]]
role = "verification-reviewer"
profile = "verification-reviewer"
agent_file = "agents/verification-reviewer.md"
model = "haiku"
policy_tier = "medium"
frontmatter_effort = "medium"

[[workers]]
role = "implementation-writer"
profile = "implementation-writer"
agent_file = "agents/implementation-writer.md"
model = "sonnet"
policy_tier = "medium-high"
frontmatter_effort = "high"

[[workers]]
role = "look-ahead-investigator"
profile = "look-ahead-investigator"
agent_file = "agents/look-ahead-investigator.md"
model = "haiku"
policy_tier = "medium"
frontmatter_effort = "medium"

# Writer bindings resolve (model, reasoning_effort) to one implementation-writer agent.
# strategy-binding.md scopes a binding to the selected implementation matrix.

[[writer_profiles]]
role = "implementation-writer"
model = "opus"
reasoning = "low"
profile = "implementation-writer-opus-low"
agent_file = "agents/implementation-writer-opus-low.md"
strategy_ids = ["casefile-implement-ticket-batch", "casefile-implement-ticket-batch-look-ahead", "casefile-implement-pipeline"]

