schema_version = 1
name = "coding"
version = "0.4.7"
publisher = "alsi-lawr"
repository = "alsi-lawr/HUMANS.md"
repository_url = "https://github.com/alsi-lawr/HUMANS.md"
license = "MIT"
description = "Reusable code-writing, Git, README, and skill-generation guidance with generic verification assets."
[[shared]]
source = "coding/LICENSE"
destination = "LICENSE"
[[shared]]
source = "coding/skills/readme-generator"
destination = "skills/readme-generator"
[[shared]]
source = "coding/skills/code-writing"
destination = "skills/code-writing"
[[shared]]
source = "coding/skills/skill-generator"
destination = "skills/skill-generator"
[[shared]]
source = "coding/verification"
destination = "verification"
[[shared]]
source = "coding/scripts/validate-skill.py"
destination = "scripts/validate-skill.py"
[[shared]]
source = "coding/scripts/verify-skill.py"
destination = "scripts/verify-skill.py"
[vendors.codex]
output = "build/marketplace/plugins/codex/coding"
[[vendors.codex.template]]
source = "coding/adapters/codex/metadata/plugin.json.in"
destination = ".codex-plugin/plugin.json"
format = "json"
[[vendors.codex.copy]]
source = "coding/adapters/codex/skills"
destination = "skills"
[vendors.claude]
output = "build/marketplace/plugins/claude/coding"
[[vendors.claude.template]]
source = "coding/adapters/claude/metadata/plugin.json.in"
destination = ".claude-plugin/plugin.json"
format = "json"
[[vendors.claude.copy]]
source = "coding/skills/git-contribution"
destination = "skills/git-contribution"
