schema_version = 1
strategy_id = "casefile-investigate-inspector-tree"
phase = "investigation"
adapter = "codex"

[orchestrator]
binding = "root"

[limits]
max_concurrent_subagents = 6
max_depth = 2

[requirements]
capabilities = ["subagents", "nested_subagents", "shared_writable_planning"]

[[workers]]
role = "inspector"
platform_profile = "casefile-investigate-inspector-tree-inspector"
model = "gpt-5.6-terra"
reasoning = "xhigh"
minimum_count = 1
maximum_count = 3
can_spawn_subagents = true

[[workers]]
role = "detective"
platform_profile = "casefile-investigate-inspector-tree-detective"
model = "gpt-5.6-terra"
reasoning = "medium"
minimum_count = 1
maximum_count = 5
can_spawn_subagents = false

[coordination]
batch_when_capacity_exceeded = true
candidate_review_before_ticket = true
shared_ticket_storage_required = true
