schema_version = 1
strategy_id = "investigation-review-dialogue"
phase = "review"
platform = "codex"

[orchestrator]
binding = "root"

[limits]
max_concurrent_subagents = 2
max_depth = 2

[[workers]]
role = "dialogue-review-chair"
platform_profile = "dialogue-review-chair"
model = "gpt-5.6-terra"
reasoning = "xhigh"
minimum_count = 1
maximum_count = 1
can_spawn_subagents = true

[[workers]]
role = "dialogue-review-challenger"
platform_profile = "dialogue-review-challenger"
model = "gpt-5.6-terra"
reasoning = "xhigh"
minimum_count = 1
maximum_count = 1
can_spawn_subagents = false

[coordination]
batch_when_capacity_exceeded = true
candidate_review_before_ticket = false
shared_ticket_storage_required = true
